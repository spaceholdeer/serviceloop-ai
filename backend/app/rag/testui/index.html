<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ServiceLoop RAG 中文测试页面</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #1f2933;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 18px; }
      main { max-width: 960px; margin: 0 auto; }
      header { display: flex; justify-content: space-between; gap: 16px; align-items: end; }
      h1 { margin: 0; font-size: 24px; }
      header p, .hint { color: #657180; }
      .status { padding: 8px 11px; border-radius: 8px; background: #e9f1ff; color: #2459a9; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
      section { padding: 18px; border: 1px solid #dce2e8; border-radius: 12px; background: #fff; }
      section.full { grid-column: 1 / -1; }
      h2 { margin: 0 0 14px; font-size: 17px; }
      label { display: block; margin-top: 10px; font-size: 13px; }
      input, textarea, button {
        width: 100%;
        margin-top: 6px;
        border: 1px solid #cbd4dd;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      textarea { min-height: 130px; resize: vertical; }
      button { border: 0; background: #1e6bff; color: #fff; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; }
      .document { padding: 10px 0; border-bottom: 1px solid #e7ebef; }
      .document:last-child { border-bottom: 0; }
      .error { color: #b42318; }
      @media (prefers-color-scheme: dark) {
        :root { background: #10171f; color: #edf2f7; }
        section { background: #18212b; border-color: #34404d; }
        header p, .hint { color: #aab5c2; }
        .status { background: #203756; color: #9ec0ff; }
        input, textarea { background: #111820; border-color: #3b4755; color: #edf2f7; }
        .document { border-color: #2d3844; }
      }
      @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } section.full { grid-column: auto; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>ServiceLoop RAG 中文测试页面</h1>
          <p>临时内存测试入口：Dense + 预构建 BM25 + RRF + ReRank</p>
        </div>
        <div class="status" id="status">正在读取状态…</div>
      </header>

      <div class="grid">
        <section>
          <h2>添加或修改临时知识</h2>
          <p class="hint">支持中文和英文知识。使用相同文档编号再次保存会生成新版本。</p>
          <form id="knowledge-form">
            <label>文档编号（修改时填写）<input id="document-id" placeholder="留空自动生成"></label>
            <label>标题<input id="title" required placeholder="例如：售后处理规则"></label>
            <label>正文<textarea id="content" required placeholder="粘贴知识资料，可包含商品型号、英文和数字"></textarea></label>
            <button type="submit">保存并重建索引</button>
          </form>
          <p id="knowledge-result"></p>
        </section>

        <section>
          <h2>知识列表</h2>
          <div id="documents" class="hint">暂无知识</div>
        </section>

        <section class="full">
          <h2>混合召回测试</h2>
          <form id="search-form">
            <label>问题<input id="query" required placeholder="请输入中文或英文问题"></label>
            <button type="submit">检索</button>
          </form>
          <p id="search-error" class="error"></p>
          <pre id="results">[]</pre>
        </section>
      </div>
    </main>
    <script>
      const statusElement = document.getElementById('status');
      const documentsElement = document.getElementById('documents');
      const resultElement = document.getElementById('results');
      const searchErrorElement = document.getElementById('search-error');

      async function request(path, options = {}) {
        const response = await fetch(path, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
        return payload;
      }

      async function refresh() {
        const [status, documents] = await Promise.all([
          request('/api/status'),
          request('/api/documents'),
        ]);
        statusElement.textContent = `${status.document_count} 篇知识 · ${status.chunk_count} 个知识块 · 索引版本 ${status.index_version}`;
        documentsElement.replaceChildren();
        if (!documents.length) {
          documentsElement.textContent = '暂无知识';
          documentsElement.className = 'hint';
          return;
        }
        documentsElement.className = '';
        documents.forEach((knowledge) => {
          const row = window.document.createElement('div');
          row.className = 'document';
          row.textContent = `${knowledge.title} · 版本 ${knowledge.version} · ${knowledge.chunk_count} 个知识块 · ${knowledge.id}`;
          documentsElement.appendChild(row);
        });
      }

      document.getElementById('knowledge-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('button');
        const message = document.getElementById('knowledge-result');
        button.disabled = true;
        message.className = '';
        message.textContent = '正在生成 Embedding 并更新索引…';
        try {
          const payload = await request('/api/documents', {
            method: 'POST',
            body: JSON.stringify({
              document_id: document.getElementById('document-id').value || null,
              title: document.getElementById('title').value,
              content: document.getElementById('content').value,
              source: 'testui',
            }),
          });
          document.getElementById('document-id').value = payload.id;
          message.textContent = `已发布 v${payload.version}，索引版本 v${payload.index_version}`;
          await refresh();
        } catch (error) {
          message.className = 'error';
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById('search-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        searchErrorElement.textContent = '';
        try {
          const payload = await request('/api/search', {
            method: 'POST',
            body: JSON.stringify({ query: document.getElementById('query').value, limit: 5 }),
          });
          resultElement.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          searchErrorElement.textContent = error.message;
        }
      });

      refresh().catch((error) => { statusElement.textContent = error.message; });
    </script>
  </body>
</html>
