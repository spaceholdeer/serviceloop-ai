[project]
name = "serviceloop-backend"
version = "0.1.0"
description = "ServiceLoop AI backend and in-process hybrid RAG"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
rag = [
    "dashscope>=1.25",
    "FlagEmbedding>=1.2",
    "langchain-community>=0.4,<1",
    "transformers>=4.44,<5",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
